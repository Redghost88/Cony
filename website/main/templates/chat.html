<div class="chat-container">
    <div class="chat-header">Cony chat</div>

    <div class="chat-messages" id="messages">
        <div class="message received">Привет! Чем могу помочь?</div>
    </div>

    <div class="chat-input-cont">

        <form onsubmit="event.preventDefault(); sendMessage()">
            <input class="chat-input" id="input" type="text" name="question"
                   placeholder="Напиши сообщение..."
                   autocomplete="off">
            <button class="chat-button" type="submit">➤</button>
        </form>
    </div>

</div>

<script>
    const messages = document.getElementById("messages")
    const input = document.getElementById("input")
    let reply_count = 0

    function sendMessage(msg_text, invisible_text = '') {
        let text = input.value.trim()
        if (!text) {
            if (msg_text) {
                text = msg_text
            } else {
                return
            }
        }

        // моё сообщение
        const msg = document.createElement("div")
        msg.className = "message sent"
        msg.textContent = text
        messages.appendChild(msg)

        const reply = document.createElement("div")
        reply.className = "message received"
        reply.id = "reply" + reply_count
        reply.innerHTML = `<div class="spinner-border spinner-border-sm" role="status">
  <span class="visually-hidden">Loading...</span>
</div>`
        let question = ""
        if (!input.value.trim()) {
            question = invisible_text + text
        } else {
            question = input.value
        }
        generate_answer(question, reply_count)
        reply_count += 1
        messages.appendChild(reply)
        messages.scrollTop = messages.scrollHeight

        input.value = ""
        messages.scrollTop = messages.scrollHeight
    }

    function generate_answer(question, ans_id) {
        fetch("/generate_chat_answer/", {
                    method: "POST",
                    headers: {"Content-Type": "application/json", "X-CSRFToken": csrf_token.getAttribute("content")},
                    body: JSON.stringify({
                        "question": question,
                    })
                },
        )
                .then(response => response.json())
                .then(req => {
                    let data = JSON.parse(req.answer)
                    let msg = data.content
                    if(data.content == null){
                        console.error("Чат не получил ответ от сервера")
                        msg = "Не получилось дать ответ. Попробуйте спросить еще раз"
                    }
                    document.getElementById("reply" + ans_id).innerHTML = msg
                })
    }
</script>
