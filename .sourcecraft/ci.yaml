on:
  push:
    - workflows: [main-workflow]
      filter:
        branches: ["master"]
  pull_request:
    - workflows: [main-workflow]
      filter:
        source_branches: ["**"]
        target_branches: ["master"]

workflows:
  main-workflow:
    tasks:
      - pep8-check
      - build-docs
      - tests

tasks:
  - name: pep8-check
    cubes:
      - name: check-pep8
        image: python:3.12-slim
        script:
          - python -m pip install --upgrade pip
          - pip install pycodestyle 
          - cd website
          - pycodestyle --max-line-length=120 .

  - name: build-docs
    cubes:
      - name: build-documentation
        image: python:3.12-slim
        env:
          DJANGO_SECRET_KEY: dummy-secret-key-for-docs-build-not-for-production
        script:
          - apt-get update
          - apt-get install -y make
          - python -m pip install --upgrade pip
          - pip install -r website/requirements.txt
          - pip install sphinx sphinx-rtd-theme
          - cd website/docs
          - make html
        artifacts:
          paths: 
           - website/docs/build/html
  - name: tests
    cubes:
      - name: run-pytests
        image: python:3.12-slim
        env:
          DJANGO_SECRET_KEY: dummy-secret-key-for-docs-build-not-for-production
        script:
          - python -m pip install --upgrade pip
          - pip install -r website/requirements.txt
          - cd website
          - pytest
        artifacts:
          paths: 
           - htmlcov/

