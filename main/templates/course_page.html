{% extends "base.html" %}

{% block title %}
Курс
{% endblock %}

{% block content %}

<div class="accordion accordion-flush" id="accordionFlushExample">
    {% for chapter in chapters %}
    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                data-bs-target="#flush-collapse{{ chapter.id }}" aria-expanded="false" aria-controls="flush-collapse{{ chapter.id }}">
                {{ chapter.title }}
            </button>
        </h2>
        <div id="flush-collapse{{ chapter.id }}" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
            <div class="accordion-body">Воруем стиль у stepik</div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
