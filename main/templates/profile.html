{% extends "base.html" %}

{% block title %}
Профиль
{% endblock %}
{% block content %}
    <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Загрузить аватарку</button>
    </form>


    <img src="{{ user.profile.avatar.url }}" alt="Аватар">
    <p> Username: {{ profile_user.username }}</p>
    <p> Присоединился: {{ profile_user.date_joined }}</p>
{% endblock %}
